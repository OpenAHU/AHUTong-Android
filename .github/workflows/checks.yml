name: Code checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      concurrency-key:
        description: Distinguish reusable checks from automatic checks or another caller.
        type: string
        required: false
        default: reusable

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.concurrency-key || 'automatic' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Automatic checks never upload Sentry artifacts or use publishing credentials.
  SENTRY_AUTH_TOKEN: ''

jobs:
  select-run:
    name: Select push or PR check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name != 'push' && 'true' || steps.select.outputs.run }}
    steps:
      - name: Checkout CI selector
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_select_run.py
          sparse-checkout-cone-mode: false

      - name: Select automatic checks
        if: github.event_name == 'push'
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_select_run.py

  checks:
    name: Source, Rust tests, Android tests and lint
    needs: select-run
    if: needs.select-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Check changed whitespace and repository hygiene
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [[ -z "$base" && -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$PUSH_BEFORE^{commit}"; then
            base="$PUSH_BEFORE"
          fi
          if [[ -n "$base" ]]; then
            git -c core.whitespace=cr-at-eol diff --check "$base" HEAD
          else
            git -c core.whitespace=cr-at-eol show --format= --check HEAD
          fi
          python3 scripts/check_repo_hygiene.py

      - name: Test release planning and deployment helpers
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_ci_*.py' -v
          if python3 -c "import cryptography" 2>/dev/null; then
            python3 -B -m unittest discover -s scripts -p 'test_decrypt_*.py' -v
          fi

      - name: Set up project toolchain
        uses: ./.github/actions/setup-android
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Test Rust libraries
        run: |
          cargo test --manifest-path sdk/Cargo.toml
          cargo test --manifest-path GuiXu-Rust/Cargo.toml
          # The pinned SDK contains an unsupported look-ahead regex; retain the existing exception.
          cargo clippy --manifest-path sdk/Cargo.toml --all-targets -- --allow clippy::invalid_regex
          cargo clippy --manifest-path GuiXu-Rust/Cargo.toml --all-targets

      - name: Android unit tests
        run: ./gradlew --no-daemon --build-cache -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Release lint after unit tests pass
        # AGP 的 lint model 任务暂不支持配置缓存序列化，单独关掉避免构建在缓存阶段失败。
        run: ./gradlew --no-daemon --no-configuration-cache --build-cache -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process :app:lintRelease :feature:circle:lintRelease --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AHUTong-check-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-release.*
            feature/circle/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
