name: Set up AHUTong Android toolchain
description: Install the pinned Android and Rust tools and restore project caches.
inputs:
  native-build:
    description: Install the NDK, Android Rust target and cargo-ndk.
    required: false
    default: 'false'
  cache-read-only:
    description: Restore caches without saving changes (required for external fork pull requests).
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools
    - name: Install Android SDK components
      shell: bash
      run: sdkmanager --install 'platforms;android-36' 'build-tools;37.0.0'
    - name: Install Android NDK
      if: inputs.native-build == 'true'
      shell: bash
      run: |
        sdkmanager --install 'ndk;28.2.13676358'
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        # cargo-ndk's panic reporter prints the entire inherited environment.
        echo "CARGO_NDK_NO_PANIC_HOOK=1" >> "$GITHUB_ENV"
        echo "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: 1.94.0
        components: clippy
        targets: ${{ inputs.native-build == 'true' && 'aarch64-linux-android' || '' }}
    - name: Cache Gradle
      uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      with:
        cache-read-only: ${{ inputs.cache-read-only == 'true' }}
    - name: Cache Cargo
      uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      with:
        workspaces: |
          sdk
          GuiXu-Rust
        save-if: ${{ inputs.cache-read-only != 'true' }}
    - name: Install cargo-ndk
      if: inputs.native-build == 'true'
      shell: bash
      run: |
        cargo install cargo-ndk --version 4.1.2 --locked
        cargo ndk --help
    - name: Prepare Gradle and check devices
      shell: bash
      run: |
        chmod +x ./gradlew
        adb devices
