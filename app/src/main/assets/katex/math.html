<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="katex.min.css">
  <link rel="stylesheet" href="texmath.css">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      color: __TEXT__;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      word-break: break-word;
    }
    p { margin: 0 0 0.65em; }
    h1, h2, h3, h4, h5, h6 { margin: 0.7em 0 0.35em; font-weight: 600; line-height: 1.35; }
    h1 { font-size: 1.35em; }
    h2 { font-size: 1.2em; }
    h3 { font-size: 1.08em; }
    ul, ol { margin: 0 0 0.65em; padding-left: 1.35em; }
    li { margin: 0.18em 0; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
      background: __CODE_BG__;
      border-radius: 6px;
      padding: 0.12em 0.3em;
    }
    pre {
      background: __CODE_BG__;
      border-radius: 12px;
      padding: 12px;
      overflow-x: auto;
      margin: 0 0 0.75em;
    }
    pre code { background: transparent; padding: 0; font-size: 0.86em; }
    blockquote {
      margin: 0 0 0.75em;
      padding: 0.1em 0 0.1em 0.9em;
      border-left: 3px solid __ACCENT__;
      color: __MUTED__;
    }
    a { color: __ACCENT__; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; margin: 0 0 0.75em; }
    th, td { border: 1px solid __BORDER__; padding: 6px 8px; text-align: left; font-size: 0.92em; }
    th { background: __SURFACE__; }
    hr { border: 0; border-top: 1px solid __BORDER__; margin: 1em 0; }
    img { max-width: 100%; height: auto; border-radius: 12px; }
    .katex-display { margin: 0.6em 0; overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body>
<div id="content"></div>
<script src="markdown-it.min.js"></script>
<script src="katex.min.js"></script>
<script src="texmath.js"></script>
<script>
  const B64 = "__SOURCE_B64__";
  const bytes = Uint8Array.from(atob(B64), c => c.charCodeAt(0));
  const SOURCE = new TextDecoder('utf-8').decode(bytes);

  const md = window.markdownit({
    html: false,
    linkify: true,
    breaks: true,
    typographer: false
  }).use(texmath, {
    engine: katex,
    delimiters: ['brackets', 'beg_end'],
    katexOptions: {
      throwOnError: false,
      strict: false
    }
  });

  const content = document.getElementById('content');
  content.innerHTML = md.render(SOURCE);

  function reportHeight() {
    if (window.AndroidHeight) {
      AndroidHeight.post(Math.ceil(document.documentElement.scrollHeight));
    }
  }
  reportHeight();
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.body);
  }
</script>
</body>
</html>
